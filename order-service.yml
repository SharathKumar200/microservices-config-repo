server:
  port: 8082

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:mysql://mysql-order:3306/orderdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  kafka:
    bootstrap-servers: kafka:9093

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: order-group

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      auto-offset-reset: earliest

      properties:
        spring.json.trusted.packages: "*"

        spring.json.value.default.type: com.example.orderservice.dto.OrderStatusEvent

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true

    service-url:
      defaultZone: http://eureka-server:8761/eureka

  instance:
    prefer-ip-address: true

    lease-expiration-duration-in-seconds: 10

    lease-renewal-interval-in-seconds: 5

zipkin:
  base-url: http://zipkin:9411

management:
  endpoints:
    web:
      exposure:
        include:
          - "*"
          - prometheus

  tracing:
    sampling:
      probability: 1.0

resilience4j:
  circuitbreaker:
    instances:

      inventoryServiceCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html

    operationsSorter: method
